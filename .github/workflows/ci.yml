name: CI

on:
  push:
  pull_request:

jobs:
  engine-tests:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing does not cancel the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p krabton-engine -p krabton-monome -p krabton-braids -p krabton-elements -p krabton-rings -p krabton-clouds -p krabton-stk -p krabton-airwindows 2>&1 | tee test.log && exit 0
          # The failing tests and their messages as an annotation on the run.
          msg=$( { grep -E "^test .* FAILED$" test.log; grep -A3 "panicked at" test.log; } | head -60 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' ) || true
          echo "::error title=Failing tests::${msg}"
          exit 1

  build-app:
    name: Build app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libgl1-mesa-dev
      - run: cargo build -p krabton
      - run: cargo test -p krabton
