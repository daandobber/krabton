[package]
name = "krabton-chimera"
description = "The CHIMERA physical-modelling voice engine by Jameson Hodge (MIT), as kept for Krabton's Airway"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "chimera"

[dependencies]
libm = "=0.2.16"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
