[package]
name = "krabton-engine"
description = "Audio engine, DSP and project model for the Krabton DAW"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
hound.workspace = true
krabton-warps = { path = "../krabton-warps" }
# FLAC decoding for samples (pure Rust, Apache-2.0).
claxon = "0.4.3"
# Memory-maps the grand piano's samples (MIT or Apache-2.0).
memmap2 = "0.9"
# SoundFont 2 synthesizer for the SF2 Player: rustysynth 1.3.7 (MIT) with
# Krabton's sound shaping, kept here as krabton-sf2.
rustysynth = { package = "krabton-sf2", path = "../krabton-sf2" }
krabton-braids = { path = "../krabton-braids" }
krabton-elements = { path = "../krabton-elements" }
krabton-airwindows = { path = "../krabton-airwindows" }
krabton-rings = { path = "../krabton-rings" }
krabton-clouds = { path = "../krabton-clouds" }
krabton-beads = { path = "../krabton-beads" }
krabton-stk = { path = "../krabton-stk" }
# Mutable Instruments Plaits DSP (MIT), pinned to a reviewed commit.
mi-plaits-dsp = { git = "https://github.com/sourcebox/mi-plaits-dsp-rs", rev = "effe9864bb67d23aaf5724722ac1ce165d4e7c9f" }
