[package]
name = "krabton-clap"
description = "CLAP plugin hosting for the Krabton DAW"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
krabton-engine = { path = "../krabton-engine" }
clap-sys = "0.5"
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi"] }

[[example]]
name = "swap_fx"
crate-type = ["cdylib"]
