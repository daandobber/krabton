[package]
name = "krabton"
description = "Krabton: an open-source, Live-inspired DAW written in Rust"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
krabton-engine = { path = "../krabton-engine" }
krabton-beads = { path = "../krabton-beads" }
krabton-braids = { path = "../krabton-braids" }
krabton-clap = { path = "../krabton-clap" }
krabton-monome = { path = "../krabton-monome" }
base64 = "0.22"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.32"
cpal = "0.16"
midir = "0.10"
rfd = "0.15"
# Unpacks the voicebanks the Singer downloads (zip archives).
miniz_oxide = "0.8"
# Pictures for the Video: PNG and JPEG (the crate eframe already uses for its icons).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The LZW of animated GIFs, for the Video (already here for TIFF).
weezl = "0.1"
# Loads PulseAudio's client library at run time (Linux sound without ALSA plugins).
libloading = "0.8"
# Game controllers for Big Picture (Xbox, PlayStation, Steam Deck, generic pads).
gilrs = "0.11"
crossbeam-channel.workspace = true
hound.workspace = true
serde.workspace = true
serde_json.workspace = true
